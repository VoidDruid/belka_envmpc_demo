[project]
name = "envmpc-demo"
version = "1.0.0"
description = "Reproducible MuJoCo experiments for disturbance-aware MPC of the BELKA robot"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "acados-template",
    "casadi==3.7.2",
    "click==8.4.2",
    "jinja2==3.1.6",
    "matplotlib==3.10.8",
    "mujoco==3.5.0",
    "numpy==2.4.2",
    "scipy==1.17.1",
    "simpleeval==1.0.7",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.10",
]

[tool.uv.sources]
acados-template = { path = "libs/acados/interfaces/acados_template", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
markers = [
    "unit: focused unit-level tests",
    "integration: MuJoCo integration tests",
    "slow: tests that build or exercise an acados solver",
]

[tool.ruff]
extend-exclude = ["build", "libs", "out", "results"]

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
ignore = ["E501", "E741"]
